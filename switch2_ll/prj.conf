# Milestone 1: prove the nRF52840 can ACCEPT and HOLD the Switch 2's 5 ms
# connection interval. Nothing else -- no GATT server, no protocol.
#
# The Switch 2 opens controller connections with a CONNECT_IND carrying
# interval=4 (5.00 ms). That is below the Bluetooth spec floor of 6 units
# (7.5 ms), so Nordic's closed SoftDevice silently refuses to join: measured
# on air, 213 CONNECT_INDs at interval=4 went completely unanswered while the
# single interval=12 (15 ms) offer connected and ran for 33 s.
#
# Zephyr's software controller applies the same rule, but in source we can
# edit -- see patches/ull_peripheral-accept-5ms.patch.

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Joy-Con 2 (R)"

# ---- Attribute table -----------------------------------------------------
# The console writes 0x000F and 0x0010 by hardcoded handle, so the table's
# POSITION matters as much as its content -- see src/switch2_gatt.c.
#
# CONFIG_BT_GATT_CACHING adds Database Hash / Client Supported Features
# attributes ahead of ours and would shift every handle. Off, so the layout is
# ours to control and stays stable across boots.
CONFIG_BT_GATT_CACHING=n

# Services are registered at runtime so the ORDER is ours, not the linker's --
# measured: static definition put the bd28x service first and threw the report
# channel seven handles off. See the comment above switch2_gatt_init().
CONFIG_BT_GATT_DYNAMIC_DB=y

# ---- Encryption ----------------------------------------------------------
# SMP is enabled for its KEY STORE, not to do any pairing.
#
# The console never runs an SMP pairing over this link. Its LL_ENC_REQ carries
# EDIV=0 and Rand=0 -- an out-of-band key -- so the GATT PAIR ceremony IS the
# key agreement, and we derive the LTK ourselves from the 0x15/0x04 exchange.
# What Zephyr provides is bt_smp_request_ltk(), which answers the controller's
# LTK request from conn->le.keys when EDIV and Rand are both zero and the key is
# typed BT_KEYS_LTK_P256. So the derived key is injected into that store the
# moment it exists -- see derive_link_key() in switch2_gatt.c.
#
# Without this the handshake completes in full and the link then dies with
# reason=0x22 (LL Response Timeout), because the console asks to encrypt and
# nothing can answer.
CONFIG_BT_SMP=y
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_SETTINGS=n

# ---- Link-key persistence -------------------------------------------------
# The Switch 2 drops dock power when it sleeps, and the puck is powered from
# that port, so EVERY wake attempt starts from a cold boot. The console does not
# re-pair on a reconnect -- it sends LL_ENC_REQ expecting the key it stored at
# registration. Measured without persistence: the console finds us on its own,
# opens a 5 ms link, and we answer LL_REJECT_EXT_IND error 0x06 (PIN or Key
# Missing), after which it terminates with 0x13, in a loop.
#
# NVS on the board's 32 KB storage_partition (0xec000). BT_SETTINGS stays off:
# we are not using Zephyr's bonding, only storing the one out-of-band key --
# see src/switch2_store.c.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
# REQUIRED, and its absence is silent: nvs_mount() needs the sector size, which
# switch2_store.c asks for with flash_get_page_info_by_offs(). Without page
# layout support that call returns -ENOTSUP, the mount fails, and the only
# symptom is that nothing is ever persisted.
CONFIG_FLASH_PAGE_LAYOUT=y

# ATT MTU 512 -- matched to the old stack, which is ground truth for a link the
# console was willing to proceed on.
#
# The console sends Exchange MTU Request with Client Rx MTU = 512. The old
# Bluefruit build answered 512 and the console immediately began service
# discovery (Read By Group Type 0x0001-0xFFFF). This build answered 247 and the
# console sent nothing further -- measured, the MTU exchange was the LAST ATT
# traffic of the entire connection, two frames and then silence.
#
# BT_BUF_ACL_RX_SIZE must cover the full L2CAP SDU plus its 4-byte header,
# because reassembly needs one contiguous buffer; TX is fragmented to the
# controller's data length so it does not.
CONFIG_BT_L2CAP_TX_MTU=512
CONFIG_BT_BUF_ACL_RX_SIZE=516
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_ATT_PREPARE_COUNT=2

# Use Zephyr's OPEN software link layer, not Nordic's SoftDevice Controller.
# The SDC is a binary blob and enforces the 7.5 ms floor where we cannot reach
# it. Selection is done in the devicetree overlay; this is belt and braces.
CONFIG_BT_LL_SW_SPLIT=y

# The console never subscribes anything in this test, but it does run a link
# layer feature exchange immediately after CONNECT_IND -- that exchange
# completing is the pass condition.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y

# Let the CONSOLE choose the connection interval -- do not negotiate.
#
# Zephyr defaults to BT_PERIPHERAL_PREF_MIN_INT=24 (30 ms) and automatically
# asks the central for it shortly after connecting. Measured 2026-08-15: the
# Switch 2 connected at interval=12 (15 ms) and then ACCEPTED our 30 ms request
# at +5 s. That is the opposite of what this test needs -- the whole point is to
# see the console push its own 5 ms interval at us and find out whether the
# patched link layer takes it. The Arduino firmware did no negotiation at all,
# and that is the configuration in which the console was observed demanding
# 5 ms, so match it.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

# USB CDC console: DO NOT enable a USB stack here. The board's
# Kconfig.defconfig already sources boards/common/usb/Kconfig.cdc_acm_serial
# which selects USB_DEVICE_STACK_NEXT and initialises CDC ACM at boot. Setting
# CONFIG_USB_DEVICE_STACK=y as well builds BOTH stacks and the link fails with
# "multiple definition of __device_dts_ord_104".
#
# That file also sets LOG_PROCESS_THREAD_STARTUP_DELAY_MS=4000, so the log
# waits for the port to enumerate before emitting.

# CRITICAL for this board. The upstream promicro_nrf52840 board definition
# defaults to CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL, i.e. an external 32.768 kHz
# crystal -- which these cheap Pro Micro clones do not have. With no LFCLK the
# BLE controller can never schedule a radio event, so bt_enable() and
# bt_le_adv_start() both return success and NOTHING is transmitted. Measured:
# firmware alive and heartbeating over USB, host reporting
# an identity and "advertising ... wake mode", while
# a 30 s sniffer survey saw six other advertisers and zero packets from us.
# The internal RC oscillator costs accuracy (500 ppm vs ~20 ppm) but works.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# ---- USB: we are a Valve Steam Controller dongle -------------------------
# The board's cdc_acm_serial helper builds a USB device automatically so the
# console works with no app code, but it hardcodes its own VID/PID and, in its
# own words, "only registers the first CDC-ACM instance" and is "intended for
# use only in applications where no other USB features are required". We need
# 28DE:1304 and five interfaces, so it is turned off and src/puck_usb.c builds
# the device instead -- including the CDC console, which would otherwise vanish.
# TEMPORARILY REVERTED to the board's auto-init while the custom device is
# debugged. Building our own context (28DE:1304 + 4 HID + CDC) made the board
# enumerate as "Unknown USB Device (Port Reset Failed)" -- no console, and
# recovery costs a physical double-tap on reset. Debugging that blind is not
# worth a button press per guess, so the console comes first and the composite
# device gets rebuilt against a working one.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_HID_SUPPORT=y

CONFIG_LOG=y
CONFIG_PRINTK=y

# Deliberately NOT CONFIG_LOG_MODE_IMMEDIATE. Immediate mode logs synchronously
# from the calling context, which on a CDC console blocks when the host is slow
# or absent -- that is exactly the 84 ms main-loop stall that distorted every
# measurement taken with the Arduino firmware. Deferred logging keeps the
# radio's timing honest, which matters more here than log latency.
#
# BUT take printk back out of the deferred path. CONFIG_LOG_PRINTK defaults to y,
# which routes printk() through the very same buffer, so "use printk instead of
# LOG_INF for diagnostics" bought nothing: measured 2026-08-15, an entire boot's
# worth of printk output AND five heartbeats were discarded, hiding a hard
# bt_le_adv_start() -ENOMEM behind a log that jumped from 0.003 s to 30 s. With
# this off, printk writes straight to the console driver and cannot be dropped.
# It blocks, so keep it to diagnostics and out of the radio's hot path.
CONFIG_LOG_PRINTK=n

# 1024 bytes is roughly ten messages -- less than one boot. The messages that
# matter here (bt_hci_core's "opcode 0x%04x status 0x%02x") arrive while USB is
# still enumerating, so the buffer has to survive the whole startup backlog.
CONFIG_LOG_BUFFER_SIZE=4096

# Real console input. uart_poll_in() never sees a byte on a CDC ACM console
# (interrupt driven), which silently broke the reboot-to-bootloader key.
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y

# console_getchar() defaults to a SIXTEEN byte ring, which is fine for single
# keypresses and silently loses characters the moment anything types a line.
# The config protocol sends whole commands at once -- "$set mouse.speed 8" is
# nineteen characters -- and the overflow showed up as commands that simply
# never executed, with the tail of one line turning up glued to the next.
# Zephyr own help text names the case: "you may need to increase it e.g. to
# support large host-side clipboard pastes".
CONFIG_CONSOLE_GETCHAR_BUFSIZE=256

# sys_reboot() -- used to reboot into a one-shot armed USB attempt (TEMPORARY,
# see the scaffolding note in switch2_store.c).
CONFIG_REBOOT=y

# The config page as a USB drive, in dongle mode only. The volume is
# synthesised per sector by puck_webdisk.c, so no disk driver and no
# filesystem are needed -- and no RAM is spent on either.
CONFIG_USBD_MSC_CLASS=y
CONFIG_DISK_ACCESS=y
